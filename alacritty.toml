# ---- Avocado Theme ---- #

[window]
# window padding {px}
padding.x = 12
padding.y = 12

[font]
size = 12.0

[colors]
[colors.primary]
# background and foreground
background = "#000000"
foreground = "#B5E631"
# slightly darker / desaturated foreground for "dim" text
dim_foreground = "#99A91D"

[colors.cursor]
text = "#000000"          # use terminal background for contrast
cursor = "#B5E631"        # primary accent

[colors.vi_mode_cursor]
text = "#000000"
cursor = "#B5E631"

[colors.selection]
text = "CellForeground"
background = "#160000"    # secondary background


[colors.normal]
black = "#000000"
red = "#E6654F"
green = "#3EAE0A"
yellow = "#EAA621"
blue = "#00BFFF"
magenta = "#99A91D"
cyan = "#EFE653"
white = "#F2FFBE"

[colors.bright]
black = "#1A1A1A"
red = "#FF0040"
green = "#B5E631"
yellow = "#EFE653"
blue = "#1E90FF"
magenta = "#B5E631"
cyan = "#99A91D"
white = "#FFFFFF"
